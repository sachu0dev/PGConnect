name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: next-app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgconnect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgconnect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pgconnect_ci
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      NEXT_PUBLIC_SITE_URL: https://pgconnect.site
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: next-app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Seed (smoke test)
        run: yarn db:seed

      - name: Build
        run: yarn build

  socket:
    name: Socket server (types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: socket-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: socket-server/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Build
        run: yarn build
